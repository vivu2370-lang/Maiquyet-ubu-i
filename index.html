<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đề Cương Của Bố Đinh Việt Phương - Lớp 7 Giữa Kỳ 1</title>
    <style>
        * { box-sizing: border-box; }

        /* Hiệu ứng viền Cầu Vồng Giật Giật Nhấp Nháy */
        @keyframes rainbowGlow {
            0% { border-color: #ff0000; box-shadow: 0 0 15px #ff0000; }
            20% { border-color: #ffff00; box-shadow: 0 0 15px #ffff00; }
            40% { border-color: #00ff00; box-shadow: 0 0 15px #00ff00; }
            60% { border-color: #00ffff; box-shadow: 0 0 15px #00ffff; }
            80% { border-color: #ff00ff; box-shadow: 0 0 15px #ff00ff; }
            100% { border-color: #ff0000; box-shadow: 0 0 15px #ff0000; }
        }

        @keyframes titleFlash {
            0% { color: #ff0000; }
            50% { color: #008000; }
            100% { color: #0000ff; }
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            line-height: 1.6;
            background-color: #f4f6f9; /* Nền sáng không sợ bị đen */
            color: #111111;
            margin: 0;
            padding: 15px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 15px;
            border: 6px solid #ff0000;
            animation: rainbowGlow 0.2s infinite linear;
        }

        header {
            text-align: center;
            border-bottom: 3px double #333;
            padding-bottom: 20px;
            margin-bottom: 25px;
        }

        h1 {
            font-size: 26px;
            text-transform: uppercase;
            font-weight: 900;
            margin-bottom: 5px;
            animation: titleFlash 0.3s infinite alternate;
        }

        .subtitle {
            color: #555;
            font-size: 15px;
            font-weight: bold;
        }

        .tiktok-btn {
            display: inline-block;
            margin-top: 12px;
            padding: 10px 20px;
            background-color: #000000;
            color: #ffffff !important;
            text-decoration: none;
            font-weight: bold;
            border-radius: 25px;
            border: 2px solid #ff0000;
            animation: rainbowGlow 0.2s infinite alternate;
        }

        .nav-tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 25px;
            justify-content: center;
        }

        .tab-btn {
            padding: 10px 16px;
            border: 2px solid #333;
            background-color: #ffffff;
            color: #000000;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
        }

        .tab-btn.active, .tab-btn:hover {
            background-color: #000000;
            color: #ffffff;
            border-color: #ff0000;
        }

        .subject-section { display: none; }
        .subject-section.active { display: block; }

        h2.subject-header {
            background-color: #e9ecef;
            color: #000;
            padding: 10px 15px;
            border-left: 6px solid #007bff;
            margin-top: 20px;
            font-size: 18px;
        }

        .box {
            background-color: #f8f9fa;
            border: 1px solid #cccccc;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 8px;
        }

        .box-title {
            font-weight: bold;
            color: #d9534f;
            margin-bottom: 8px;
        }

        ul.options { list-style-type: none; padding-left: 0; }
        ul.options li { padding: 4px 0; }

        .correct-answer {
            color: #008000;
            font-weight: bold;
            background-color: #e2f0d9;
            padding: 2px 6px;
            border-radius: 4px;
            border: 1px dashed #008000;
            display: inline-block;
        }

        .btn-print {
            display: block;
            width: 100%;
            padding: 14px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 30px;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>ĐỀ CƯƠNG CỦA BỐ ĐINH VIỆT PHƯƠNG</h1>
        <div class="subtitle">BỘ ĐỀ THI GIỮA KỲ 1 LỚP 7 - TẤT CẢ CÁC MÔN HỌC</div>
        
        <a href="https://www.tiktok.com/@12tuoi_ba_kai" target="_blank" class="tiktok-btn">
            🔗 Kênh TikTok: @12tuoi_ba_kai
        </a>
    </header>

    <div class="nav-tabs">
        <button class="tab-btn active" onclick="openSubject('van')">Ngữ Văn 7</button>
        <button class="tab-btn" onclick="openSubject('toan')">Toán 7</button>
